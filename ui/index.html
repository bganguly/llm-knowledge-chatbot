<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Query</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2e3147;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --text: #e2e4f0;
    --muted: #6b7280;
    --source-bg: #1e2235;
    --error: #ef4444;
    --success: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 80px;
  }
  header {
    width: 100%;
    max-width: 720px;
    margin-bottom: 36px;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

  form {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.95rem;
    line-height: 1.5;
    padding: 14px 16px;
    resize: vertical;
    min-height: 90px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  label { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
  input[type="date"] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.85rem;
    padding: 8px 12px;
    outline: none;
    color-scheme: dark;
  }
  input[type="date"]:focus { border-color: var(--accent); }

  button[type="submit"] {
    margin-left: auto;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 10px 24px;
    transition: background 0.15s, opacity 0.15s;
  }
  button[type="submit"]:hover { background: var(--accent-hover); }
  button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

  #result {
    width: 100%;
    max-width: 720px;
    margin-top: 28px;
    display: none;
    flex-direction: column;
    gap: 16px;
  }
  .answer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    line-height: 1.65;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }
  .answer-card.uncertain { border-color: #d97706; }
  .answer-card.error { border-color: var(--error); color: var(--error); }

  .meta {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .badge {
    background: var(--source-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
  }
  .badge.warn { border-color: #d97706; color: #fbbf24; }
  .badge.ok { border-color: #166534; color: var(--success); }

  .sources-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .source-chip {
    background: var(--source-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.75rem;
    padding: 4px 10px;
    word-break: break-all;
    color: var(--accent-hover);
    text-decoration: none;
    transition: border-color 0.1s;
  }
  .source-chip:hover { border-color: var(--accent); }

  .conflict-note {
    background: #1f1a0a;
    border: 1px solid #78350f;
    border-radius: 8px;
    color: #fcd34d;
    font-size: 0.82rem;
    padding: 10px 14px;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Knowledge <span>Query</span></h1>
  <p class="subtitle">BM25 retrieval · Claude Haiku · temporal snapshots</p>
</header>

<form id="form">
  <textarea id="question" placeholder="Ask a question about the knowledge base…" required></textarea>
  <div class="row">
    <label for="as_of">Answer as of date (optional)</label>
    <input type="date" id="as_of">
    <button type="submit" id="submit-btn">Ask</button>
  </div>
</form>

<div id="result">
  <div id="answer-card" class="answer-card"></div>
  <div id="meta" class="meta"></div>
  <div id="conflict-note" class="conflict-note" style="display:none"></div>
  <div id="sources-wrap" style="display:none">
    <p class="sources-label">Sources</p>
    <div id="sources" class="sources"></div>
  </div>
</div>

<script>
const form = document.getElementById("form");
const questionEl = document.getElementById("question");
const asOfEl = document.getElementById("as_of");
const submitBtn = document.getElementById("submit-btn");
const resultEl = document.getElementById("result");
const answerCard = document.getElementById("answer-card");
const metaEl = document.getElementById("meta");
const conflictEl = document.getElementById("conflict-note");
const sourcesWrap = document.getElementById("sources-wrap");
const sourcesEl = document.getElementById("sources");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = questionEl.value.trim();
  if (!question) return;

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>';
  answerCard.className = "answer-card";
  answerCard.innerHTML = "";
  metaEl.innerHTML = "";
  conflictEl.style.display = "none";
  sourcesWrap.style.display = "none";
  sourcesEl.innerHTML = "";
  resultEl.style.display = "flex";

  const payload = { question };
  const asOf = asOfEl.value;
  if (asOf) payload.as_of = asOf;

  try {
    const res = await fetch("/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();

    if (!res.ok) {
      answerCard.className = "answer-card error";
      answerCard.textContent = data.detail || data.error || "Error from API";
    } else {
      answerCard.className = data.confident ? "answer-card" : "answer-card uncertain";
      answerCard.textContent = data.answer;

      metaEl.innerHTML = `
        <span class="badge ${data.confident ? "ok" : "warn"}">${data.confident ? "confident" : "uncertain"}</span>
        <span>${data.latency_ms} ms</span>
        ${asOf ? `<span>as of ${asOf}</span>` : ""}
      `;

      if (data.conflict_note) {
        conflictEl.textContent = "⚠ " + data.conflict_note;
        conflictEl.style.display = "block";
      }

      if (data.sources && data.sources.length) {
        const seen = new Set();
        data.sources.forEach(s => {
          if (seen.has(s.url)) return;
          seen.add(s.url);
          const a = document.createElement("a");
          a.className = "source-chip";
          a.href = s.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = s.url.replace(/^https?:\/\//, "");
          sourcesEl.appendChild(a);
        });
        sourcesWrap.style.display = "block";
      }
    }
  } catch (err) {
    answerCard.className = "answer-card error";
    answerCard.textContent = "Network error: " + err.message;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Ask";
  }
});
</script>
</body>
</html>
